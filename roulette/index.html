<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#03102a">
  <title>オープニングルーレット | 即日回収ラピッド</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #03102a; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #03102a; }
  </style>
</head>
<body>
  <iframe id="rouletteFrame" title="即日回収ラピッド オープニングルーレット" allow="clipboard-write"></iframe>
  <script>
    // 広告流入の gclid / gbraid / wbraid / UTM を、タグが動く同一オリジンの本体へ引き継ぐ。
    // roulette は必ず表示モードに固定し、同名パラメータによる挙動変更を防ぐ。
    (function () {
      var target = new URL("/", location.origin);
      var params = new URLSearchParams(location.search);
      params.set("roulette", "1");
      // Vercelの確認用Previewでは、リロードするたびに再抽選できるレビュー専用モードにする。
      if (/\.vercel\.app$/i.test(location.hostname)) params.set("rlreview", "1");
      target.search = params.toString();
      target.hash = location.hash;
      document.getElementById("rouletteFrame").src = target.pathname + target.search + target.hash;
    })();
  </script>
</body>
</html>
