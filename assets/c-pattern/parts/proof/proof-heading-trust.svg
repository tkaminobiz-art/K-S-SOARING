  <g font-family="'Hiragino Kaku Gothic StdN','Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif" font-weight="900" text-anchor="middle" filter="url(#deepShadow)">
    <text x="343" y="70" font-size="42" letter-spacing="1" fill="#5f2500" stroke="#351000" stroke-width="9.5" stroke-linejoin="round">地域密着の</text>
    <text x="343" y="70" font-size="42" letter-spacing="1" fill="url(#goldClear)">地域密着の</text>
    <text x="343" y="70" font-size="42" letter-spacing="1" fill="url(#goldSheen)" clip-path="url(#topSheen)" opacity=".74">地域密着の</text>

    <text x="343" y="150" font-size="75" letter-spacing="1" fill="#5a2100" stroke="#2f0d00" stroke-width="14.5" stroke-linejoin="round">信頼と実績</text>
    <text x="343" y="150" font-size="75" letter-spacing="1" fill="url(#goldClear)">信頼と実績</text>
    <text x="343" y="150" font-size="75" letter-spacing="1" fill="url(#goldSheen)" clip-path="url(#topSheen)" opacity=".74">信頼と実績</text>
  </g>

