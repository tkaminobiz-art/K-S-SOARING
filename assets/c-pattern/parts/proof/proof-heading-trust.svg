    <use href="#leftStem" stroke="url(#leafGold)" stroke-width="2" stroke-linecap="round"/>
    <use href="#rightStem" stroke="#a25f00" stroke-width="4" stroke-linecap="round"/>
    <use href="#rightStem" stroke="url(#leafGold)" stroke-width="2" stroke-linecap="round"/>

